name: Global Intelligence Morning Paper Cloud Scheduler (云端免开机全自动推送)

on:
  schedule:
    # 第一道保险：提前至 UTC 21:50（北京时间 05:50）进入队列，抵消 GitHub 免费 runner 约 1.5~2 小时排队延迟，确保在 07:20~07:50 准点送达
    - cron: '50 21 * * *'
    # 第二道接力：UTC 22:25（北京时间 06:25）进入队列，双重兜底保障在 08:00 前完成（脚本自带跨端幂等锁，若已发送自动秒级跳过）
    - cron: '25 22 * * *'
  workflow_dispatch: # 允许在 GitHub 网页界面随时一键点击手动测试触发

jobs:
  morning-paper:
    name: Generate & Dispatch Morning Paper to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies & Chinese CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei google-chrome-stable || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Render Ultra-HD Morning Paper & Push to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE_URL: https://global-news-8lp.pages.dev
        run: |
          node scripts/send_discord_morning_paper.js

      - name: Archive Daily Morning Paper Image Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-paper-daily
          path: public/morning_paper.png
          retention-days: 7
