name: Global Intelligence Morning Paper Cloud Scheduler (云端免开机全自动推送)

on:
  schedule:
    # 提前至每天北京时间 07:45 (即 UTC 时间 23:45) 自动云端执行，避开整点 00 分的全球拥堵洪峰，确保早间准时送达
    - cron: '45 23 * * *'
  workflow_dispatch: # 允许在 GitHub 网页界面随时一键点击手动测试触发

jobs:
  morning-paper:
    name: Generate & Dispatch Morning Paper to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies & Chinese CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei google-chrome-stable || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Render Ultra-HD Morning Paper & Push to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          API_BASE_URL: https://global-news-8lp.pages.dev
        run: |
          node scripts/send_discord_morning_paper.js

      - name: Archive Daily Morning Paper Image Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-paper-daily
          path: public/morning_paper.png
          retention-days: 7
