name: Test Cloudflare Next on Pages Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-cf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Next on Pages build
        run: |
          npx @cloudflare/next-on-pages > build_output.log 2>&1 || true
          cat build_output.log
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
